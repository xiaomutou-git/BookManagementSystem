<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理 - 图书管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <i class="fas fa-book-open"></i>
                <h1>图书管理系统</h1>
            </div>
            <div class="navbar-nav">
                <a href="/" class="nav-link" data-page="home">首页</a>
                <a href="/books/" class="nav-link" data-page="books">图书列表</a>
                <a href="/add-book/" class="nav-link" data-page="add-book">添加图书</a>
                <a href="/categories/" class="nav-link active" data-page="categories">分类管理</a>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索图书...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <!-- 用户登录/菜单区域 -->
            <div class="user-menu-container">
                <!-- 未登录状态显示登录按钮 -->
                <div id="login-btn-container" class="user-menu-item">
                    <a href="/login/" class="btn btn-primary login-btn">登录</a>
                </div>
                <!-- 已登录状态显示用户菜单 -->
                <div id="user-dropdown-container" class="user-menu-item" style="display: none;">
                    <div class="user-dropdown-trigger">
                        <span id="current-username" class="username"></span>
                        <i class="fas fa-caret-down"></i>
                    </div>
                    <div class="user-dropdown-menu">
                        <a href="#" class="dropdown-item" id="edit-profile-btn">
                            <i class="fas fa-user-edit"></i> 编辑个人信息
                        </a>
                        <a href="#" class="dropdown-item" id="settings-btn">
                            <i class="fas fa-cog"></i> 设置
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item logout-btn" id="logout-btn">
                            <i class="fas fa-sign-out-alt"></i> 退出登录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <section id="categories" class="page active">
            <div class="container">
                <div class="categories-header">
                    <h2>分类管理</h2>
                </div>

                <!-- 添加分类表单 -->
                <div class="form-container categories-form">
                    <h3>添加新分类</h3>
                    <form id="add-category-form">
                        <div class="form-group categories-form-group">
                            <div>
                                <label for="name">分类名称 *</label>
                                <input type="text" id="name" name="name" required placeholder="请输入分类名称">
                            </div>
                            <div>
                                <label for="description">分类描述</label>
                                <input type="text" id="description" name="description" placeholder="请输入分类描述">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus"></i> 添加分类
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 分类列表 -->
                <h3 class="categories-subtitle">分类列表</h3>
                <div class="categories-grid" id="categories-grid">
                    <!-- 分类卡片将通过JavaScript动态生成 -->
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 图书管理系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- JavaScript文件 -->
    <script src="/js/data.js?v=10"></script>
    <script src="/js/ui.js?v=10"></script>
    <script src="/js/main.js?v=10"></script>
</body>
</html>
