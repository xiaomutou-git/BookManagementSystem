<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书列表 - 图书管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <i class="fas fa-book-open"></i>
                <h1>图书管理系统</h1>
            </div>
            <div class="navbar-nav">
                <a href="/" class="nav-link" data-page="home">首页</a>
                <a href="/books/" class="nav-link active" data-page="books">图书列表</a>
                <a href="/add-book/" class="nav-link" data-page="add-book">添加图书</a>
                <a href="/categories/" class="nav-link" data-page="categories">分类管理</a>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索图书...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <!-- 用户登录/菜单区域 -->
            <div class="user-menu-container">
                <!-- 未登录状态显示登录按钮 -->
                <div id="login-btn-container" class="user-menu-item">
                    <a href="/login/" class="btn btn-primary login-btn">登录</a>
                </div>
                <!-- 已登录状态显示用户菜单 -->
                <div id="user-dropdown-container" class="user-menu-item" style="display: none;">
                    <div class="user-dropdown-trigger">
                        <span id="current-username" class="username"></span>
                        <i class="fas fa-caret-down"></i>
                    </div>
                    <div class="user-dropdown-menu">
                        <a href="#" class="dropdown-item" id="edit-profile-btn">
                            <i class="fas fa-user-edit"></i> 编辑个人信息
                        </a>
                        <a href="#" class="dropdown-item" id="settings-btn">
                            <i class="fas fa-cog"></i> 设置
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item logout-btn" id="logout-btn">
                            <i class="fas fa-sign-out-alt"></i> 退出登录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <section id="books" class="page active">
            <div class="container">
                <div class="books-header">
                    <h2>图书列表</h2>
                    <a href="/add-book/" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 添加图书
                    </a>
                </div>

                <!-- 过滤和搜索 -->
                <div class="filter-container">
                    <div class="filter-group">
                        <label for="category-filter">分类:</label>
                        <select id="category-filter">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="rating-filter">最低评分:</label>
                        <select id="rating-filter">
                            <option value="0">全部评分</option>
                            <option value="4.5">4.5+</option>
                            <option value="4.0">4.0+</option>
                            <option value="3.5">3.5+</option>
                            <option value="3.0">3.0+</option>
                        </select>
                    </div>
                    <button id="reset-filter" class="btn btn-outline">
                        <i class="fas fa-redo"></i> 重置过滤器
                    </button>
                </div>

                <!-- 图书网格 -->
                <div class="books-grid" id="books-grid">
                    <!-- 图书卡片将通过JavaScript动态生成 -->
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 图书管理系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- JavaScript文件 -->
    <script src="/js/data.js?v=10"></script>
    <script src="/js/ui.js?v=10"></script>
    <script src="/js/main.js?v=10"></script>
</body>
</html>
