<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加图书 - 图书管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <i class="fas fa-book-open"></i>
                <h1>图书管理系统</h1>
            </div>
            <div class="navbar-nav">
                <a href="/" class="nav-link" data-page="home">首页</a>
                <a href="/books/" class="nav-link" data-page="books">图书列表</a>
                <a href="/add-book/" class="nav-link active" data-page="add-book">添加图书</a>
                <a href="/categories/" class="nav-link" data-page="categories">分类管理</a>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索图书...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <!-- 用户登录/菜单区域 -->
            <div class="user-menu-container">
                <!-- 未登录状态显示登录按钮 -->
                <div id="login-btn-container" class="user-menu-item">
                    <a href="/login/" class="btn btn-primary login-btn">登录</a>
                </div>
                <!-- 已登录状态显示用户菜单 -->
                <div id="user-dropdown-container" class="user-menu-item" style="display: none;">
                    <div class="user-dropdown-trigger">
                        <span id="current-username" class="username"></span>
                        <i class="fas fa-caret-down"></i>
                    </div>
                    <div class="user-dropdown-menu">
                        <a href="#" class="dropdown-item" id="edit-profile-btn">
                            <i class="fas fa-user-edit"></i> 编辑个人信息
                        </a>
                        <a href="#" class="dropdown-item" id="settings-btn">
                            <i class="fas fa-cog"></i> 设置
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item logout-btn" id="logout-btn">
                            <i class="fas fa-sign-out-alt"></i> 退出登录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <section id="add-book" class="page active">
            <div class="container">
                <div class="form-container">
                    <h2>添加图书</h2>
                    <form id="add-book-form">
                        <div class="form-group">
                            <label for="title">书名 *</label>
                            <input type="text" id="title" name="title" required placeholder="请输入书名">
                        </div>
                        
                        <div class="form-group">
                            <label for="author">作者 *</label>
                            <input type="text" id="author" name="author" required placeholder="请输入作者名">
                        </div>
                        
                        <div class="form-group">
                            <label for="category">分类 *</label>
                            <select id="category" name="category" required>
                                <option value="">请选择分类</option>
                                <!-- 分类选项将通过JavaScript动态生成 -->
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="isbn">ISBN</label>
                            <input type="text" id="isbn" name="isbn" placeholder="请输入ISBN号码">
                        </div>
                        
                        <div class="form-group">
                            <label for="publishDate">出版日期</label>
                            <input type="date" id="publishDate" name="publishDate">
                        </div>
                        
                        <div class="form-group">
                            <label for="rating">评分</label>
                            <input type="number" id="rating" name="rating" min="0" max="5" step="0.1" placeholder="0.0 - 5.0">
                        </div>
                        
                        <div class="form-group">
                            <label for="coverImage">封面图片URL</label>
                            <input type="url" id="coverImage" name="coverImage" placeholder="请输入封面图片URL">
                        </div>
                        
                        <div class="form-group">
                            <label for="description">内容简介</label>
                            <textarea id="description" name="description" rows="5" placeholder="请输入图书内容简介"></textarea>
                        </div>

                        <div class="form-section-title">库存信息</div>
                        <div class="form-group">
                            <label for="totalCopies">总册数</label>
                            <input type="number" id="totalCopies" name="totalCopies" min="1" value="1" placeholder="图书总册数（默认1）">
                        </div>
                        
                        <div class="form-group">
                            <label for="availableCopies">可借册数</label>
                            <input type="number" id="availableCopies" name="availableCopies" min="0" placeholder="可借册数（默认与总册数一致）">
                        </div>
                        
                        <div class="form-actions">
                            <a href="/books/" class="btn btn-outline">取消</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 图书管理系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- JavaScript文件 -->
    <script src="/js/data.js?v=10"></script>
    <script src="/js/ui.js?v=10"></script>
    <script src="/js/main.js?v=10"></script>
</body>
</html>
